services:
  - type: web
    name: paydawg
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: APP_ENV
        value: production
      - key: DEMO_MODE
        value: "false"
      - key: DATABASE_URL
        value: sqlite:///./paydawg.db
      - key: LLM_PROVIDER
        value: none
      - key: PAYPAL_ENABLED
        value: "false"
